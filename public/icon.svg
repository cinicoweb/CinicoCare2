<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <!-- Pill Top Half (Vibrant Cyan/Sky) -->
    <linearGradient id="capsuleSky" x1="140" y1="140" x2="280" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Pill Bottom Half (Vibrant Emerald/Teal or Pure White Glow) -->
    <linearGradient id="capsuleTeal" x1="240" y1="240" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f0fdfa" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="glossGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0284c7" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <clipPath id="pillClip">
      <!-- Full Capsule Shape rotated 45 deg -->
      <rect x="-70" y="-150" width="140" height="300" rx="70" />
    </clipPath>
  </defs>

  <!-- Squircle App Container -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow Rings -->
  <circle cx="256" cy="256" r="190" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="8 12" />
  <circle cx="256" cy="256" r="215" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.15" />

  <!-- Centered Stylized Pill/Capsule -->
  <g transform="translate(256, 256) rotate(-45)" filter="url(#dropShadow)">
    
    <!-- Capsule Container with Clip for Split Colors -->
    <g clip-path="url(#pillClip)">
      <!-- Top Half: Sky Blue -->
      <rect x="-75" y="-155" width="150" height="155" fill="url(#capsuleSky)" />
      <!-- Bottom Half: Teal / Bright White Pearl -->
      <rect x="-75" y="0" width="150" height="155" fill="url(#capsuleTeal)" />

      <!-- Center Divider Line & Shadow Seam -->
      <line x1="-75" y1="0" x2="75" y2="0" stroke="#0f172a" stroke-opacity="0.2" stroke-width="3" />
      <line x1="-75" y1="1" x2="75" y2="1" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2" />

      <!-- Sleek Longitudinal Gloss Light Streak (Left edge) -->
      <path d="M-52 -110 C-52 -135 -30 -140 -15 -140 C-30 -130 -40 -100 -40 80 C-40 120 -30 130 -15 140 C-40 135 -52 110 -52 80 Z" fill="url(#glossGrad)" />
      
      <!-- Top Cap Shimmer -->
      <ellipse cx="0" cy="-115" rx="36" ry="18" fill="#ffffff" fill-opacity="0.35" />
    </g>

    <!-- Pill Border Rim for crisp definition -->
    <rect x="-70" y="-150" width="140" height="300" rx="70" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.4" />

    <!-- Stylized Heart-Cross Medical Spark on Top Shell -->
    <g transform="translate(0, -65)">
      <!-- Mini Cross / Plus -->
      <rect x="-4" y="-18" width="8" height="36" rx="4" fill="#ffffff" />
      <rect x="-18" y="-4" width="36" height="8" rx="4" fill="#ffffff" />
      <circle cx="0" cy="0" r="4" fill="#38bdf8" />
    </g>

    <!-- Active Indicator Sparkle on Bottom Shell -->
    <g transform="translate(0, 70)">
      <circle cx="0" cy="0" r="12" fill="#0f766e" fill-opacity="0.15" />
      <circle cx="0" cy="0" r="6" fill="#0f766e" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    </g>
  </g>
</svg>
